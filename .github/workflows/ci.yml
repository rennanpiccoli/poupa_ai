# CI: runs on every PR. Nothing is published here. Also called by deploy.yml before publishing.
name: ci
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: supermkt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/supermkt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: make install
      - run: make lint
      - run: npm test # Postgres comes from the service above (make test would start docker)
